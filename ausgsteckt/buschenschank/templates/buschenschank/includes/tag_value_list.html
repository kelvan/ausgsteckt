{% if make_badge %}
  {% for value in values %}
    <span class="inline-flex items-center px-2 py-0.5 rounded-full bg-gold-tint text-gold text-[11px] font-semibold mr-1 mb-1">{{ value }}</span>
  {% endfor %}
{% elif make_list %}
  <ul class="list-disc pl-4 space-y-0.5">
    {% for value in values %}
      <li>{{ value }}</li>
    {% endfor %}
  </ul>
{% else %}
  {% for value in values %}
    {% if forloop.counter0 %},&nbsp;{% endif %}{{ value }}
  {% endfor %}
{% endif %}
