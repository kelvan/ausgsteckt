{% load i18n osm_tags %}

<details class="mb-8 group">
  <summary class="flex items-center gap-2 text-xs font-semibold text-ink-faint cursor-pointer select-none hover:text-ink-soft py-2">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="transition-transform group-open:rotate-90 shrink-0"><path d="M9 6l6 6-6 6"/></svg>
    {% trans 'Raw OpenStreetMap tags' %}
    <span class="font-normal">({{ buschenschank.tags|length }})</span>
  </summary>
  <div class="mt-3 rounded-xl border border-border overflow-hidden text-xs">
    {% for tag, value in buschenschank.tags.items %}
      <div class="flex items-start gap-3 px-3 py-2 {% if not forloop.first %}border-t border-border{% endif %} {% cycle 'bg-paper' 'bg-surface/40' %}">
        <code class="shrink-0 w-[42%] sm:w-[220px] text-ink-faint font-mono break-words">{{ tag }}</code>
        <div class="flex-1 min-w-0 text-ink-soft break-words">{{ value|format_value_list:tag|safe }}</div>
      </div>
    {% endfor %}
  </div>
</details>
