{% extends 'base.html' %}

{% load i18n %}

{% block content %}
  <div class="max-w-3xl mx-auto px-4 md:px-10 py-8 flex flex-col gap-5">
    <h1 class="font-serif font-semibold text-2xl md:text-3xl text-ink">{{ page_title }}</h1>

    {% if object_list.exists %}
      {% include 'buschenschank/includes/buschenschank_list.html' with buschenschank_list=object_list %}
    {% else %}
      <div class="px-5 py-4 rounded-2xl bg-gold-tint text-gold text-sm font-semibold">
        {% trans 'Nothing there' %}
      </div>
    {% endif %}
  </div>
{% endblock %}
