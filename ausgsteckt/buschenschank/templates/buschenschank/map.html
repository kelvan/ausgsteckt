{% extends 'base.html' %}

{% load static %}

{% block viewport %}
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
{% endblock %}

{% block extracss %}
  <link rel="stylesheet" href="{% static 'css/buschenschank/map.css' %}">
  <link rel="stylesheet" href="{% static 'leaflet/dist/leaflet.css' %}">
  <link rel="stylesheet" href="{% static 'css/MarkerCluster.css' %}">
  <link rel="stylesheet" href="{% static 'css/MarkerCluster.Default.css' %}">
{% endblock %}

{% block extrajs %}
  <script src="{% static 'leaflet/dist/leaflet.js' %}"></script>
  <script src="{% static 'leaflet-providers/leaflet-providers.js' %}"></script>
  <script src="{% static 'leaflet-plugins/control/Permalink.js' %}"></script>
  <script src="{% static 'leaflet-plugins/control/Permalink.Marker.js' %}"></script>
  <script src="{% static 'leaflet-plugins/control/Permalink.Layer.js' %}"></script>
  <script src="{% static 'leaflet-plugins/control/Permalink.Overlay.js' %}"></script>
  <script src="{% static 'js/leaflet.markercluster.js' %}"></script>
  <script src="{% static 'js/buschenschank/map.js' %}"></script>
{% endblock %}

{% block bodyattr %}
  onload="main_map_init('ausgstecktmap')"
{% endblock %}

{% block content %}
  <div id="buschenschank_maps" data-geojson-url="{% url 'buschenschank:buschenschank.geojson' %}" data-details-url="{% url 'buschenschank:buschenschank_details_api' '000' %}">
    <div id="ausgstecktmap"></div>
  </div>
{% endblock %}
