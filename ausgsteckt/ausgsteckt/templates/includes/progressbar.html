<div class="flex items-center gap-2 w-full max-w-[180px]">
  <div class="flex-1 h-2 rounded-full bg-surface overflow-hidden">
    <div
      class="h-full rounded-full {% if progress < 40 %}bg-terracotta{% elif progress < 70 %}bg-gold{% else %}bg-sage{% endif %}"
      style="width: {{ progress }}%"
    ></div>
  </div>
  <span class="text-xs text-ink-faint w-9 text-right">{{ progress }}%</span>
</div>
