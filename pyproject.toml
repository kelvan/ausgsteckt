[tool.poetry]
name = "ausgsteckt"
version = "1.0"
description = ""
authors = ["Florian Schweikert <kelvan@ist-total.org>"]
readme = "README.rst"

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
django = ">=4.2.8,<4.3.0"
psycopg2-binary = "^2.9.10"
django-environ = ">=0.12.0,<0.13.0"
django-model-utils = ">=5.0.0,<6.0.0"
python-dateutil = ">=2.8.2,<2.10.0"
requests = ">=2.32.3,<2.33.0"
aiohttp = "^3.11.11"
aiodns = "^3.2.0"
pymemcache = ">=4.0.0,<5.0.0"
django-pipeline = ">=2.1.0,<3.0.0"
lesscpy = "^0.15.1"
pillow = "^11.1.0"
easy-thumbnails = "^2.10"
pytz = "^2024.2"
pyproj = ">=3.7.0,<3.8.0"
jsmin = "^3.0.1"
django-prose-editor = ">=0.10.3,<0.11.0"
wikipedia = "^1.4.0"
poetry = ">=2.0.1,<3.0.0"
confz = "^2.0.1"
django-json-widget = "^2.0.1"
async-timeout = "^5.0.1"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
ruff = "^0.9.3"
ty = "*"
ipython = "<9.0.0"
django-stubs = ">=4.2.7,<5.0"
django-stubs-ext = ">=4.2.7,<5.0"
types-requests = ">=2.32.0.20241016"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = ">=8.1.3,<9.0.0"

[tool.poetry.group.server]
optional = true

[tool.poetry.group.server.dependencies]
gunicorn = "^23.0.0"
gevent = "^24.11.1 "

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
unittest-xml-reporting = ">=3.2.0,<4.0.0"

[build-system]
requires = ["poetry-core"]

[tool.ruff]
src = ["ausgsteckt/*"]
exclude = [
    "docs",
    ".direnv",
    ".eggs",
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".tox",
    ".venv",
    "__pypackages__",
    "venv",
    "env",
    "docs",
    "dist",
    "build",
    ".pytest_cache",
    ".mypy_cache",
    "migrations",
    "public",
]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "A", "B", "N", "UP", "T", "PL", "RUF", "I"]
ignore = ["A001", "A002", "B008", "PLR0913", "PLR2004", "N805", "N812"]
per-file-ignores = {"*/settings/*.py" = ["F403", "F405", "UP015"]}
mccabe.max-complexity = 10
