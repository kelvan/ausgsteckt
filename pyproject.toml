[project]
name = "ausgsteckt"
version = "1.0"
description = ""
authors = [{name = "Florian Schweikert", email = "kelvan@ist-total.org"}]
readme = "README.rst"
requires-python = ">=3.12,<3.15"
dependencies = [
    "django>=5.2,<5.3",
    "psycopg[binary]>=3.1,<4",
    "django-model-utils>=5.0.0,<6.0.0",
    "python-dateutil>=2.8.2,<2.10.0",
    "requests>=2.33.0,<3",
    "aiohttp>=3.14.0,<4",
    "aiodns>=3.2.0,<4",
    "pymemcache>=4.0.0,<5.0.0",
    "pillow>=12.3.0,<13",
    "sorl-thumbnail>=12.11.0,<13",
    "pytz>=2024.2",
    "pyproj>=3.7.0,<4",
    "django-prose-editor>=0.25.1,<0.26",
    "django-js-asset>=3.1.2,<4",
    "confz>=2.0.1,<3",
    "django-json-widget>=2.0.1,<3",
    "dj-database-url>=2.3,<3",
]

[dependency-groups]
dev = [
    "ruff>=0.9.3",
    "ty",
    "ipython<9.0.0",
    "django-stubs>=5.2,<6.0",
    "django-stubs-ext>=5.2,<6.0",
    "types-requests>=2.32.0.20241016",
]
docs = [
    "sphinx>=8.1.3,<9.0.0",
]
server = [
    "gunicorn>=23.0.0,<24",
    "gevent>=24.11.1,<25",
]
test = [
    "unittest-xml-reporting>=3.2.0,<4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.ruff]
src = ["ausgsteckt/*"]
exclude = [
    "docs",
    ".direnv",
    ".eggs",
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".tox",
    ".venv",
    "__pypackages__",
    "venv",
    "env",
    "docs",
    "dist",
    "build",
    ".pytest_cache",
    ".mypy_cache",
    "migrations",
    "public",
]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "A", "B", "N", "UP", "T", "PL", "RUF", "I"]
ignore = ["A001", "A002", "B008", "PLR0913", "PLR2004", "N805", "N812"]
per-file-ignores = {"*/settings/*.py" = ["F403", "F405", "UP015"]}
mccabe.max-complexity = 10
