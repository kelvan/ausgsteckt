[tool.poetry]
name = "ausgsteckt"
version = "1.0"
description = ""
authors = ["Florian Schweikert <kelvan@ist-total.org>"]
readme = "README.rst"

[tool.poetry.dependencies]
python = ">3.8,<4.0"
django = ">=3.2.12,<3.3.0"
psycopg2-binary = "^2.9.5"
django-environ = "<0.9"
django-model-utils = ">=4.2.0,<4.3.0"
python-dateutil = ">=2.8.2,<2.9.0"
requests = ">=2.27.1,<2.28.0"
aiohttp = "^3.8.4"
cchardet = "^2.1.7"
aiodns = "^3.0.0"
python-memcached = "^1.59"
django-pipeline = "^2.1.0"
lesscpy = "^0.15.1"
raven = "^6.10.0"
pillow = "^9.4.0"
easy-thumbnails = "^2.8.5"
pytz = "^2022.7.1"
pyproj = ">=1.9.5,<1.10.0"
jsmin = "^3.0.1"
django-ckeditor = ">=5.7.1,<5.8.0"
django-js-asset = ">=1.2.2,<1.3.0"
wikipedia = "^1.4.0"
poetry = ">=1.3.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
black = "^23.1.0"
ruff = "^0.0.246"
mypy = "^1.0.0"
ipython = "<8"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = "<6"

[tool.poetry.group.server]
optional = true

[tool.poetry.group.server.dependencies]
gunicorn = "^20.1.0"
gevent = "^22.10.2"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
unittest-xml-reporting = ">=2.5.1,<2.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
select = ["E", "F", "W", "A", "B", "N", "UP", "T", "PL", "RUF"]
ignore = ["PLR0913", "PLR2004", "N805", "A003"]

exclude = [
    "docs",
    ".direnv",
    ".eggs",
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".tox",
    ".venv",
    "__pypackages__",
    "venv",
    "env",
    "docs",
    "dist",
    "build",
    ".pytest_cache",
    ".mypy_cache",
    "migrations",
]
line-length = 120
target-version = "py37"

[tool.ruff.per-file-ignores]
"*/settings/*.py" = ["F403", "F405", "UP015"]


[tool.black]
line-length = 120
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.tox
  | \.venv
  | env
  | venv
  | docs
  | _skbuild
  | _build
  | buck-out
  | build
  | dist
)/
'''
